---
variables:
  UV_IMAGE_PREFIX: kearblx6.c1.gra9.container-registry.ovh.net/ghcr
  IMAGE_NAME: dams-base-transcoder

include:
  - component: $CI_SERVER_FQDN/rnd/inuits/dams/ci-components/build-security-deliver@v0.0.7
    inputs:
      image_name: ${IMAGE_NAME}
      dockerfile_path: docker/uv.Dockerfile
      build_args:
        - UV_IMAGE_PREFIX=${UV_IMAGE_PREFIX}

  - component: $CI_SERVER_FQDN/rnd/inuits/dams/ci-components/deliver-customers@v0.0.7
    inputs:
      image_name: ${IMAGE_NAME}
      values_key: .base-transcoder
      customers:
        - CUSTOMER: digipolis-damsv2
          VALUES_REPO: customers/digipolis/dams-v2/digipolis-dams-v2-helm-values
        - CUSTOMER: vliz-dams
          VALUES_REPO: customers/vliz/dams/vliz-dams-elody-helm-values
        - CUSTOMER: cultuurconnect-podiumnet
          VALUES_REPO: customers/cultuur-connect/podiumnet/cultuur-connect-podiumnet-elody-helm-values
